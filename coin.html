<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Coin with Fish</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
      /* Checkerboard so the transparent coin's alpha is visible on screen.
         It is NOT drawn onto the canvas, so exports stay transparent. */
      background:
        conic-gradient(#e9e9ef 90deg, #cfcfd8 90deg 180deg, #e9e9ef 180deg 270deg, #cfcfd8 270deg) 0 0 / 32px 32px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #333;
    }
    #coin { width: 320px; height: 320px; }
    .controls { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; }
    button {
      background: #1f2430; color: #f2f2f2;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 0.5rem 1.1rem; border-radius: 999px;
      font-size: 0.9rem; cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: #2c3444; }
    button.rec { background: #b3261e; border-color: #ff6b61; }
    .caption { font-size: 0.82rem; letter-spacing: 0.03em; opacity: 0.7; text-align: center; max-width: 340px; }
  </style>
</head>
<body>
  <!-- Rendered at 2x for crisp exports (640x640 backing store, shown at 320) -->
  <canvas id="coin" width="640" height="640"></canvas>

  <div class="controls">
    <button id="toggle">Pause</button>
    <button id="speed">Faster</button>
    <button id="rec" class="rec">● Record .webm</button>
  </div>
  <div class="caption">Spinning gold coin with a fish, on a transparent background.
    The checkerboard is just the page — exports keep the alpha channel.</div>

  <script>
  (function () {
    const canvas = document.getElementById("coin");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    const cx = W / 2, cy = H / 2;
    const R = W * 0.42;          // coin radius
    const DEPTH = W * 0.035;     // coin thickness (seen edge-on)

    // ---- drawing ----------------------------------------------------------
    function roundedGold(grad) {
      grad.addColorStop(0.00, "#fff6d5");
      grad.addColorStop(0.35, "#f4c430");
      grad.addColorStop(0.72, "#c9971a");
      grad.addColorStop(1.00, "#8a5a00");
      return grad;
    }

    // A stylised fish, drawn centered at (0,0) in a ~2R box, facing right.
    function drawFish(scaleX) {
      ctx.save();
      ctx.scale(scaleX, 1);            // squash with the coin's spin
      const s = R * 0.9;               // fish overall size

      // body
      ctx.beginPath();
      ctx.moveTo(-0.05 * s, 0);
      ctx.bezierCurveTo( 0.05 * s, -0.34 * s,  0.55 * s, -0.30 * s,  0.72 * s, 0);
      ctx.bezierCurveTo( 0.55 * s,  0.30 * s,  0.05 * s,  0.34 * s, -0.05 * s, 0);
      ctx.closePath();
      const body = ctx.createLinearGradient(-0.1 * s, -0.3 * s, 0.7 * s, 0.3 * s);
      body.addColorStop(0, "#1b6f8c");
      body.addColorStop(1, "#0e4a63");
      ctx.fillStyle = body;
      ctx.fill();
      ctx.lineWidth = R * 0.012;
      ctx.strokeStyle = "rgba(0,0,0,0.25)";
      ctx.stroke();

      // tail
      ctx.beginPath();
      ctx.moveTo(-0.05 * s, 0);
      ctx.lineTo(-0.45 * s, -0.26 * s);
      ctx.lineTo(-0.30 * s, 0);
      ctx.lineTo(-0.45 * s, 0.26 * s);
      ctx.closePath();
      ctx.fillStyle = "#12586f";
      ctx.fill();
      ctx.stroke();

      // top fin
      ctx.beginPath();
      ctx.moveTo(0.18 * s, -0.24 * s);
      ctx.quadraticCurveTo(0.30 * s, -0.44 * s, 0.44 * s, -0.20 * s);
      ctx.closePath();
      ctx.fillStyle = "#12586f";
      ctx.fill();
      ctx.stroke();

      // eye
      ctx.beginPath();
      ctx.arc(0.5 * s, -0.06 * s, 0.06 * s, 0, Math.PI * 2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.beginPath();
      ctx.arc(0.515 * s, -0.06 * s, 0.028 * s, 0, Math.PI * 2);
      ctx.fillStyle = "#08222c"; ctx.fill();

      // gill line
      ctx.beginPath();
      ctx.moveTo(0.30 * s, -0.16 * s);
      ctx.quadraticCurveTo(0.24 * s, 0, 0.30 * s, 0.16 * s);
      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.lineWidth = R * 0.016;
      ctx.stroke();
      ctx.restore();
    }

    function draw(angle) {
      ctx.clearRect(0, 0, W, H);       // transparent background
      const c = Math.cos(angle);       // signed squash factor
      const a = Math.abs(c);
      const rx = Math.max(R * a, DEPTH); // never fully flat: show the edge

      // --- coin edge (visible when near edge-on) ---
      if (R * a < R) {
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, R, 0, 0, Math.PI * 2);
        const edge = ctx.createLinearGradient(cx - rx, 0, cx + rx, 0);
        edge.addColorStop(0, "#8a5a00");
        edge.addColorStop(0.5, "#e8b93b");
        edge.addColorStop(1, "#8a5a00");
        ctx.fillStyle = edge;
        ctx.fill();
        ctx.restore();
      }

      // --- coin face ---
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, R, 0, 0, Math.PI * 2);
      ctx.clip();

      const face = ctx.createRadialGradient(
        cx - rx * 0.35, cy - R * 0.35, R * 0.1,
        cx, cy, R * 1.1
      );
      ctx.fillStyle = roundedGold(face);
      ctx.fillRect(cx - rx, cy - R, rx * 2, R * 2);

      // inner rim ring
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx * 0.86, R * 0.86, 0, 0, Math.PI * 2);
      ctx.lineWidth = R * 0.05;
      ctx.strokeStyle = "rgba(138,90,0,0.55)";
      ctx.stroke();

      // fish (mirrors onto the back face)
      ctx.translate(cx, cy);
      drawFish(c >= 0 ? a : -a);
      ctx.setTransform(1, 0, 0, 1, 0, 0);

      // sweeping glare
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, R, 0, 0, Math.PI * 2);
      ctx.clip();
      const gx = cx + Math.sin(angle * 2) * rx;
      const glare = ctx.createLinearGradient(gx - rx * 0.5, cy - R, gx + rx * 0.5, cy + R);
      glare.addColorStop(0.0, "rgba(255,255,255,0)");
      glare.addColorStop(0.5, "rgba(255,255,255,0.45)");
      glare.addColorStop(1.0, "rgba(255,255,255,0)");
      ctx.fillStyle = glare;
      ctx.fillRect(cx - rx, cy - R, rx * 2, R * 2);
      ctx.restore();

      ctx.restore();

      // outer highlight ring
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, R, 0, 0, Math.PI * 2);
      ctx.lineWidth = R * 0.03;
      ctx.strokeStyle = "rgba(255,246,213,0.7)";
      ctx.stroke();
    }

    // Exposed for the headless .mov renderer: draw one exact frame.
    window.drawAngle = draw;

    // ---- interactive loop -------------------------------------------------
    let angle = 0, spinning = true, period = 3.2, last = null;
    window.__headless = false;

    function loop(t) {
      if (last == null) last = t;
      const dt = (t - last) / 1000; last = t;
      if (spinning && !window.__headless) angle = (angle + dt * (2 * Math.PI) / period) % (Math.PI * 2);
      if (!window.__headless) draw(angle);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // ---- controls ---------------------------------------------------------
    const toggle = document.getElementById("toggle");
    const speed = document.getElementById("speed");
    const rec = document.getElementById("rec");

    toggle.onclick = () => {
      spinning = !spinning;
      toggle.textContent = spinning ? "Pause" : "Play";
    };
    speed.onclick = () => {
      period = period > 1.2 ? period - 0.8 : 3.2;
      speed.textContent = period <= 1.2 ? "Reset speed" : "Faster";
    };

    // In-browser recording -> transparent WebM (VP9 alpha, Chromium).
    let recorder = null, chunks = [];
    rec.onclick = () => {
      if (recorder && recorder.state === "recording") { recorder.stop(); return; }
      const stream = canvas.captureStream(60);
      const types = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
      const mime = types.find(t => MediaRecorder.isTypeSupported(t)) || "";
      recorder = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 8e6 } : undefined);
      chunks = [];
      recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: "video/webm" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = "coin.webm"; a.click();
        URL.revokeObjectURL(url);
        rec.textContent = "● Record .webm"; rec.disabled = false;
      };
      recorder.start();
      rec.textContent = "■ Stop & save";
      // auto-stop after one full, seamless rotation
      setTimeout(() => { if (recorder.state === "recording") recorder.stop(); }, period * 1000);
    };
  })();
  </script>
</body>
</html>
