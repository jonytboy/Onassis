<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Coin</title>
  <style>
    :root {
      --gold-light: #ffe9a8;
      --gold: #f4c430;
      --gold-dark: #b8860b;
      --gold-deep: #8a5a00;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      background: radial-gradient(circle at 50% 30%, #2a2a3a, #0d0d14 70%);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #d9d9e3;
      overflow: hidden;
    }

    /* Perspective wrapper */
    .stage {
      perspective: 800px;
    }

    /* The coin spins around the Y axis */
    .coin {
      position: relative;
      width: 200px;
      height: 200px;
      transform-style: preserve-3d;
      animation: spin 3.2s linear infinite;
    }

    /* Both faces share the round, layered-gold look */
    .face {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 45%, var(--gold-dark) 80%, var(--gold-deep));
      box-shadow:
        inset 0 0 0 10px rgba(255, 255, 255, 0.15),
        inset 0 0 0 14px var(--gold-dark),
        inset 0 6px 20px rgba(255, 255, 255, 0.4),
        inset 0 -8px 22px rgba(0, 0, 0, 0.35),
        0 20px 40px rgba(0, 0, 0, 0.45);
      font-size: 5rem;
      font-weight: 800;
      color: var(--gold-deep);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5), 0 -1px 0 rgba(0, 0, 0, 0.3);
    }

    .face.back {
      transform: rotateY(180deg);
    }

    /* Soft rotating glare that sweeps across the surface */
    .face::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(120deg, transparent 40%, rgba(255, 255, 255, 0.55) 50%, transparent 60%);
      animation: glare 3.2s linear infinite;
    }

    @keyframes spin {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(360deg); }
    }

    @keyframes glare {
      from { transform: translateX(-60%); opacity: 0; }
      45%  { opacity: 1; }
      to   { transform: translateX(60%); opacity: 0; }
    }

    /* Ground shadow that pulses with the spin for a sense of depth */
    .shadow {
      width: 180px;
      height: 26px;
      margin-top: 1.5rem;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.5);
      filter: blur(10px);
      animation: shadowPulse 3.2s ease-in-out infinite;
    }

    @keyframes shadowPulse {
      0%, 100% { transform: scaleX(1);   opacity: 0.5; }
      50%      { transform: scaleX(0.6); opacity: 0.25; }
    }

    .controls { display: flex; gap: 0.75rem; }

    button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #eee;
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: rgba(255, 255, 255, 0.18); }

    .caption { font-size: 0.85rem; letter-spacing: 0.05em; opacity: 0.6; }

    /* Respect users who prefer no motion */
    @media (prefers-reduced-motion: reduce) {
      .coin, .face::after, .shadow { animation: none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="coin" id="coin">
      <div class="face front">$</div>
      <div class="face back">$</div>
    </div>
  </div>
  <div class="shadow"></div>

  <div class="controls">
    <button id="toggle">Pause</button>
    <button id="flip">Flip</button>
    <button id="speed">Faster</button>
  </div>
  <div class="caption">A spinning gold coin — pure HTML &amp; CSS</div>

  <script>
    const coin = document.getElementById("coin");
    const toggle = document.getElementById("toggle");
    const flip = document.getElementById("flip");
    const speed = document.getElementById("speed");

    let running = true;
    let duration = 3.2;

    toggle.addEventListener("click", () => {
      running = !running;
      coin.style.animationPlayState = running ? "running" : "paused";
      toggle.textContent = running ? "Pause" : "Play";
    });

    flip.addEventListener("click", () => {
      // Quick vertical flip on top of the horizontal spin
      coin.animate(
        [{ transform: "rotateX(0deg)" }, { transform: "rotateX(360deg)" }],
        { duration: 600, easing: "ease-in-out" }
      );
    });

    speed.addEventListener("click", () => {
      duration = duration > 1 ? duration - 0.8 : 3.2; // cycle back around
      const dur = duration + "s";
      document.querySelectorAll(".coin, .face::after, .shadow");
      coin.style.animationDuration = dur;
      speed.textContent = duration <= 1 ? "Reset" : "Faster";
    });
  </script>
</body>
</html>
