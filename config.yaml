# --- Launch policy ---------------------------------------------------
# The pipeline always completes automatically up to "Launch Ready" (a design
# plus its CEO-approved product drafts). This policy governs the final launch:
#   manual    — wait for one approval (`--approve-launch <campaign_id>`), which
#               approves the master design AND every approved product at once.
#   scheduled — reach Launch Ready and wait for a scheduled approval.
#   automatic — approve the launch automatically at the end of the cycle.
launch:
  # manual    — drafts everything, waits for one approval (safe default).
  # scheduled — same as manual; an external scheduler approves.
  # automatic — approves the launch at the end of the cycle (no human step).
  policy: automatic
  # When true, an approved launch ACTIVATES the drafts as LIVE Etsy listings
  # (real products for sale). Set false to stop at draft and review manually.
  auto_go_live: true

# --- Design Package Builder ------------------------------------------
# Turns ONE CEO-approved opportunity into a print-ready design package. It does
# NOT publish, create Etsy listings, or create mock-ups — it produces the
# structured brief + prompts a future artwork generator will consume.
design:
  exports_dir: exports          # base export directory
  subdir: opportunities         # packages live under exports/opportunities/<id>/
  # Deterministic print/production spec (Gelato DTG friendly):
  file_formats: ["PNG", "SVG"]  # PNG (raster master), SVG (vector master)
  dpi: 300
  transparent_background: true
  print_area: "30cm x 40cm (A3 DTG print area)"
  print_size_default: "Up to 30cm wide; keep artwork within the print area."
  safe_margin: "Keep all critical elements at least 2cm inside the print area; no bleed needed for DTG."
  gelato_notes: >-
    Export print files as 300 DPI PNG with a transparent background, sRGB colour,
    sized to the product's print area with the documented safe margin. Provide an
    SVG vector master where the artwork is vector-based. No mock-up is created
    here; Gelato applies the artwork to the chosen garment at fulfilment.

# --- Listing factory (prepares Etsy listings; never publishes) -------
listing:
  exports_dir: exports          # where listing packages are written
  currency: GBP
  quantity: 50
  target_margin: 0.60           # recommended price = production_cost / (1 - margin)
  default_production_cost: 12.0 # used when no product cost is known
  # Launch-quality gate: a description shorter than this (or any truncated title/
  # description/materials/tags) is a fixable BLOCK — the copy is regenerated
  # before the Etsy draft is created, never shipped unfinished.
  min_description_chars: 120
  # Etsy upload defaults (set once at the account level; not per-listing editing):
  who_made: i_did               # i_did | someone_else | collective
  when_made: made_to_order
  is_supply: false
  taxonomy_id: 1                # Etsy taxonomy id (account/category specific)
  shipping_profile_id: null     # set once at account level
  # The mock-ups every listing requires:
  mockups:
    - primary
    - lifestyle_1
    - lifestyle_2
    - scale
    - detail

# --- Artwork Studio (production AI image generation) -----------------
# Generates the ACTUAL image files (master artwork, print file, product artwork,
# mock-ups, and an 8-10 image Etsy gallery) — not prompts. Production uses a real
# image model (OpenAI GPT Image); the backend is replaceable via a provider
# registry so more providers can be added without touching the pipeline.
image:
  # auto   -> the provider when an API key is present, else the DEV local renderer.
  # remote -> force the provider (warns + falls back to local if no key).
  # local  -> the built-in Pillow renderer (DEVELOPMENT ONLY; recognisably basic).
  backend: auto
  provider: openai             # production provider (registry: openai / gpt-image-1)
  base_url: https://api.openai.com/v1
  model: gpt-image-1
  quality: high                # gpt-image-1: low | medium | high | auto
  moderation: auto             # gpt-image-1 content moderation: auto | low
  timeout: 180                 # seconds per image (generation can be slow)
  # A successful GPT image is NEVER replaced. On a genuine backend failure the
  # exact exception is always logged; this only decides whether the dev renderer
  # is then substituted (true) or the image fails loudly (false).
  fallback_to_local: true
  # api_key is read from IMAGE_API_KEY / OPENAI_API_KEY (never hard-code it).
  gallery_count: 6             # DISTINCT gallery mockups per product (Sprint 42.2: no duplicate renders; 4-6)
  max_attempts: 3              # QC regenerations for GENUINE quality failures only
  # The model returns its native size (GPT Image = 1024²); the accepted image is
  # the master and is UPSCALED to these targets — never re-requested larger.
  upscaler: pillow             # pillow (Lanczos) | register an AI upscaler provider
  master_px: 2048              # master artwork square size (upscale target)
  print_px: 3600               # print file size (~300 DPI, A3-ish print area)
  gallery_px: 1200             # commercial gallery image size
  quality_gate:                # the deterministic quality gate thresholds
    min_coverage: 0.015        # reject near-blank images
    max_coverage: 0.995        # reject solid/flat images
    min_stddev: 6.0            # require visible detail/contrast (readability)

# --- Publisher -------------------------------------------------------
# Publishes approved listing packages. Only Draft (and Dry Run) are enabled;
# Live publishing is intentionally not implemented yet.
publishing:
  default_mode: draft            # dry_run | draft | live
  enabled_modes: [dry_run, draft, live]   # 'live' activates listings on Etsy
  max_retries: 3                 # safe retries on transient publish failures
  min_go_live_margin: 0.10       # never take a product live below this NET margin

# --- Compliance thresholds -------------------------------------------
# The Compliance Director's veto rules (Sprint 7). Risk scores are 0-100.
compliance:
  # Commercial gatekeeper: it BLOCKS only concrete violations in five legal
  # categories (copyright / trademark-with-evidence / prohibited-claim /
  # etsy-policy / illegal). Everything else is a logged ADVISORY that never
  # blocks publishing. The scores below only drive the fallback for pure
  # risk-score responses: HIGH risk -> a block, medium risk -> an advisory.
  high_risk_threshold: 70        # score at/above this (concrete) -> a blocking issue
  medium_risk_threshold: 40      # score in [medium, high) -> an advisory, not a block
  brand_consistency_min: 70      # below this -> an advisory (governance), never a block
  # A FIXABLE blocking issue (e.g. a prohibited claim) is auto-amended and
  # re-reviewed up to this many times; still not clean -> blocked (bounded).
  # Advisories never trigger regeneration.
  max_remediation_attempts: 3
