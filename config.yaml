# ===================================================================
# ONASSIS v0.1 — Application Configuration
# -------------------------------------------------------------------
# This is the single source of truth for non-secret settings.
# Environment variables (see .env.example) override any value here at
# runtime, so this file is safe to commit.
# ===================================================================

app:
  name: ONASSIS
  version: "0.1.0"
  environment: development          # overridden by ONASSIS_ENV

logging:
  level: INFO                        # overridden by LOG_LEVEL
  directory: logs
  file: onassis.log
  # Keep N rotated log files of `max_bytes` each.
  max_bytes: 1048576                 # 1 MiB
  backup_count: 5

database:
  path: data/onassis.db              # overridden by ONASSIS_DB_PATH

scheduler:
  # Time of day the daily pipeline runs (24h, local time).
  run_at: "08:00"                    # overridden by ONASSIS_RUN_AT
  # If true, the pipeline also runs once immediately on startup. Handy
  # for development; you typically want this false in production.
  run_on_start: true

# --- LLM provider ----------------------------------------------------
# Powers content generation. The agents read the API key from the
# ANTHROPIC_API_KEY environment variable (see .env.example).
llm:
  model: claude-opus-4-8             # Anthropic model ID
  effort: high                       # low | medium | high — depth vs. cost
  max_tokens: 8000                   # per-generation output ceiling

# --- Brand voice & strategy -----------------------------------------
# Consumed by the Content Director when assembling the daily brief.
brand:
  name: Local Celebrity              # overridden by ONASSIS_BRAND_NAME
  positioning: "premium Mediterranean lifestyle"
  tagline: "Live like the coast is yours."
  tone: "aspirational, warm, effortlessly refined — editorial, never salesy"
  target_audience: "discerning travellers and design lovers drawn to the slow, sun-soaked elegance of the Mediterranean"
  # The brand's strategic pillars. The Content Director draws on these
  # (alongside the season and past campaigns) to compose each daily brief.
  content_pillars:
    - "Slow Mediterranean mornings & coastal rituals"
    - "Sun-washed interiors & timeless homes"
    - "Island-hopping & hidden coastal escapes"
    - "Linen, leather & the effortless Riviera wardrobe"
    - "Long lunches & the art of the Mediterranean table"
    - "Sea, salt & unhurried wellness"
    - "Everyday luxuries worth slowing down for"

# --- Content production targets --------------------------------------
# How much the Content Creator produces per daily brief. Change these
# numbers and the Creator adapts automatically — no code change needed.
content_targets:
  pinterest_posts: 5
  instagram_captions: 3
  facebook_posts: 2
  image_prompts: 3

# --- Company policy --------------------------------------------------
# The rules the CEO evaluates every proposal against (Sprints 6 & 8).
# ONASSIS is a capital-allocation system: every proposal is an investment,
# ranked by risk-adjusted ROI, funded highest-return-first.
policy:
  available_cash: 10000          # current cash on hand (for the reserve check)
  cash_reserve: 5000             # never let cash fall below this
  min_profit_margin: 0.30        # (revenue - cost) / revenue must be >= this
  max_ai_spend: 50               # max cost for a single AI-spend action
  max_experiment_budget: 200     # max cost for an experiment
  min_confidence: 50             # below this, the CEO requests more information
  brand_consistency_min: 70      # min brand-consistency score (0-100) to approve
  daily_ai_budget: 100           # never spend beyond this on AI per day
  min_roi: 0.50                  # hurdle: min risk-adjusted ROI to fund (the "£1" test)
  risk_weights:                  # discount applied to ROI by risk level
    low: 1.0
    medium: 0.7
    high: 0.4

# --- Profit engine ---------------------------------------------------
# Drives the profit dashboard. Cash balance starts from policy.available_cash
# and moves with ledger costs/revenue.
profit:
  ai_cost_per_campaign: 0.50     # estimated AI cost recorded per campaign run

# --- Etsy connector (read-only, observation only) --------------------
# Credentials come from the environment (never commit them):
#   ETSY_API_KEY, ETSY_ACCESS_TOKEN, ETSY_SHOP_ID
etsy:
  base_url: "https://openapi.etsy.com/v3/application"
  # Used to estimate fees when a receipt doesn't itemise them.
  transaction_fee_rate: 0.065    # Etsy transaction fee
  payment_fee_rate: 0.04         # payment processing

# --- Compliance thresholds -------------------------------------------
# The Compliance Director's veto rules (Sprint 7). Risk scores are 0-100.
compliance:
  high_risk_threshold: 70        # any risk at/above this -> hard reject (veto)
  medium_risk_threshold: 40      # any risk at/above this -> request changes
  brand_consistency_min: 70      # min brand-consistency score to approve
